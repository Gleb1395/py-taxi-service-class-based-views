{% extends "base.html" %}
{% block content %}
    <ul>
    {% for driver in drivers %}
      <li>
        <a
            href="{% url 'taxi:driver_detail' driver.id %}">
          {{ driver.first_name }}
          {{ driver.last_name }}
          {{ driver.license_number }}
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
